name: Release HrothBeGone

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      Project_Name: HrothBeGone

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build with dotnet
      run: dotnet build --configuration Release

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HrothBeGone
        path: .\HrothBeGone\bin\Release\HrothBeGone\*
        if-no-files-found: error
        retention-days: 1

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace 'refs/tags/v', '' } else { '0.1.0.0' }
        $tag = "v$version"

        Compress-Archive -Force -Path .\HrothBeGone\bin\Release\HrothBeGone\* -DestinationPath HrothBeGone.zip

        $existing = gh release view $tag --json tagName 2>$null
        if ($existing) {
          gh release upload $tag HrothBeGone.zip --clobber
        } else {
          gh release create $tag HrothBeGone.zip --title "HrothBeGone $tag" --notes "Automatic release build of HrothBeGone $tag."
        }
